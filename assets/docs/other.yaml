page:
  - name: "About Blair's Law"
    notes: |-
      On July 4, 2011, Blair Shanahan Lane was killed by a stray bullet from celebratory gunfire. She was only 11 years old.
      13 years later, on July 9, 2024, Gov. Mike Parson [signed a public safety bill into law](https://www.kcur.org/politics-elections-and-government/2024-07-10/missouri-governor-signs-blairs-law-banning-celebratory-gunfire-named-after-killed-kansas-city-girl) which included **Blair's Law**,
      establishing state penalties for celebratory gunfire. The law took effect on **August 28, 2024**.

      Blair's Law, [**RSMo §571.031**](https://revisor.mo.gov/main/OneSection.aspx?section=571.031), makes it a crime for any individual to recklessly discharge a firearm within or into the
      limits of any municipality within the state.

      | Offense | Charge Code | Class |
      |---|---|---|
      | Third or subsequent offense | 571.031-001Y202452 | Class D Felony |
      | Second offense | 571.031-002Y202452 | Class E Felony |
      | First offense | 571.031-003Y202452 | Class A Misdemeanor |

      The Jackson County Prosecutor's Office [welcomes the measure as another tool to prosecute reckless gun use](https://jacksoncountyprosecutor.com/civicalerts.aspx?aid=1592),
      and hopes enforcement of this law will reduce gun violence and enhance public safety within Jackson County.

  - name: "About Valentine's Law"
    notes: |-
      In December 2021, St. Louis County detective Antonio Valentine was killed in the line of duty after being struck by a
      fleeing car while inside an unmarked police vehicle. **Valentine's Law** was signed by Gov. Mike Parson
      on July 9, 2024, and took effect on **August 28, 2024**.

      Valentine's Law, [**RSMo §575.151**](https://revisor.mo.gov/main/OneSection.aspx?section=575.151), creates the offense of "aggravated fleeing a stop or detention of a motor vehicle,"
      which applies when an individual who knows a law enforcement officer is attempting to detain their vehicle flees at a
      high speed that creates a substantial risk of serious physical injury or death, or actually causes injury or death.

      | Offense | Charge Code | Class |
      |---|---|---|
      | Causes death of another | 575.151-001Y202449 | Class A Felony |
      | Causes physical injury | 575.151-002Y202449 | Class B Felony |
      | Creates substantial risk of injury (no probation/parole until ≥ 1 year served) | 575.151-003Y202449 | Class D Felony |

      The Jackson County Prosecutor's Office has and will continue to enforce Valentine's Law as another tool to ensure traffic safety and public
      safety within Jackson County.